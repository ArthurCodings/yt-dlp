# CreatorKit 配置示例
# 复制到 %USERPROFILE%\.creatorkit.toml（全局）或当前目录的 creatorkit.toml，按需修改。
# 命令行参数优先级高于这里。

# 素材库根目录：每条视频一个文件夹，外加 索引.md / library.jsonl
output_dir = "E:/CreatorKit/library"

# 默认模式：video 视频 / audio 只要音频 / text 只要文字
mode = "video"

# 语音识别策略：auto 没有平台字幕时才识别 / always 总是识别 / never 从不
asr = "auto"

# 中文字形：hans 简体 / hant 繁体（台湾用语）/ hk 繁体（香港）/ keep 保持原样
script = "hans"

# 语音识别模型：large-v3-turbo（推荐，快且准）/ large-v3（最准，慢）/ medium / small
model = "large-v3-turbo"
device = "auto"          # auto 有 N 卡就用显卡 / cuda / cpu
compute_type = "auto"    # 显存不够可改 int8_float16
# language = "zh"        # 强制识别语言；不写则自动检测

# 平台字幕语言偏好（只在“和视频原语言一致”的字幕里挑）
prefer_langs = ["zh-hans", "zh-hant", "zh", "en", "ja", "ko"]

video_max_height = 1080  # 视频最高分辨率
audio_format = "m4a"     # audio 模式的格式：m4a / mp3 / opus / best
keep_audio = false       # text 模式下转写后是否保留音频
write_thumbnail = true   # 保存封面 cover.jpg

# ---- 登录与网络 ----
# 抖音必须带 cookie；B 站登录后能拿到更高画质和 CC 字幕。
# 新版 Chrome/Edge 的 cookie 无法直接读取，推荐用浏览器扩展导出（见 README）。
# 可以是单个 cookies.txt，也可以是文件夹（每个平台一个 .txt，自动合并）：
# cookies = "E:/CreatorKit/cookies"
# 用 Firefox 登录的话可以直接读取：
# cookies_from_browser = "firefox"

# 抖音：用本机 Chrome/Edge 打开视频页获取作品数据（需安装 creatorkit[browser]）
douyin_browser = true
browser_headless = true   # false 则显示浏览器窗口，遇到验证码时可手动完成

# proxy = "http://127.0.0.1:7897"

# 合集/频道一次最多处理多少条
# max_items = 20
